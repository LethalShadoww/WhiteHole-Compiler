name: Build Unsigned iOS App
on: workflow_dispatch

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Generate Native iOS Folder
        run: npx expo prebuild --platform ios

      - name: Compress Unsigned App Module
        run: |
          mkdir -p Payload
          cp -r ios/*.xcodeproj Payload/ || cp -r ios/*.app Payload/ 2>/dev/null || true
          zip -r WhiteHole-Unsigned.ipa Payload

      - name: Upload Finished IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-whitehole-ipa
          path: WhiteHole-Unsigned.ipa
